name: Playwright Tests
# Test CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      API_URL: ${{ secrets.API_URL }}
      X_API_KEY: ${{ secrets.X_API_KEY }}

    steps:
      - name: Validate required GitHub secrets
        run: |
          if [ -z "${BASE_URL}" ]; then echo "BASE_URL secret is missing"; exit 1; fi
          if [ -z "${API_URL}" ]; then echo "API_URL secret is missing"; exit 1; fi
          if [ -z "${X_API_KEY}" ]; then echo "X_API_KEY secret is missing"; exit 1; fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test
        continue-on-error: true

      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: ignore

      - name: Prepare Allure Report
        if: always()
        run: |
          mkdir -p allure-report
          if [ ! -d "allure-results" ]; then
            printf '%s\n' \
              '<!DOCTYPE html>' \
              '<html>' \
              '<body>' \
              '<h1>No Allure results generated</h1>' \
              '<p>Playwright tests did not produce any results for this run.</p>' \
              '</body>' \
              '</html>' > allure-report/index.html
          fi

      - name: Generate Allure Report
        if: always()
        run: |
          if [ -d "allure-results" ]; then
            npm run allure:generate || true
          fi

      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report
          if-no-files-found: error

  deploy:
    needs: test
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download Allure Report
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
